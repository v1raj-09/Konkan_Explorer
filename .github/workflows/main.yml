name: Konkan Explorer CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: docker build -t virajsawant/konkan-backend:latest ./backend

      - name: Build Frontend Image
        run: docker build -t virajsawant/konkan-frontend:latest ./Frontend

      - name: Push Backend Image
        run: docker push virajsawant/konkan-backend:latest

      - name: Push Frontend Image
        run: docker push virajsawant/konkan-frontend:latest
