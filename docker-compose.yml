services:
  mongo:
    image: mongo:8
    container_name: konkan-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: konkan-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/konkanExplorer
      JWT_SECRET: your_super_secret_jwt_key_change_this
      JWT_EXPIRES_IN: 1d
    depends_on:
      - mongo

  frontend:
    build: ./Frontend
    container_name: konkan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: